[functions.startlab]
# Public login/reset entry point. Each privileged operation verifies its token.
verify_jwt = false

# [Claude, 2026-10-17] Auth settings from Docs/SUPABASE_SETUP.md, used by `supabase start` locally.
# The hosted project keeps its dashboard values until they are deliberately pushed; check them there.
[auth]
site_url = "https://jakobsawazki.github.io/StartLab/"
additional_redirect_urls = ["https://jakobsawazki.github.io/StartLab/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Closed until the acceptance test is done and Jakob decides on registration (tasks.md 8, 12).
enable_signup = false
# Not listed on the CLI reference page; part of the generated template. Verify in the dashboard.
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
